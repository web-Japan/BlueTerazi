<!DOCTYPE html>
<html lang="ja">
<head>

<script>
(function () {
  function validEntry() {
    try {
      var token = sessionStorage.getItem("blueTempleEntryToken");
      var ts = Number(sessionStorage.getItem("blueTempleEntryTime") || "0");
      return token === "ok" && ts > 0 && (Date.now() - ts) < 30000;
    } catch (e) {
      return false;
    }
  }

  if (!validEntry()) {
    window.location.replace("./index.html?v=11");
    return;
  }

  try {
    sessionStorage.removeItem("blueTempleEntryToken");
    sessionStorage.removeItem("blueTempleEntryTime");
  } catch (e) {}

  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      window.location.replace("./index.html?v=11");
    }
  });
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=11">
<title>そんな貴方に!</title>
</head>
<body>
<main class="page page--answer">
<section class="answerHero"><p class="answerHero__tagline">今夜くらい、飲んで忘れよう。</p></section>
<section class="shop">
<h2 class="shop__name">Bar BlueTemple</h2>

    <div class="shop__photo shop__photo--compact" id="shopPhoto">
      <img src="shop-photo.jpg" alt="Bar BlueTemple 店舗写真" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='assets/shop-photo.jpg';}else{this.style.display='none';this.nextElementSibling.style.display='flex';}">
      <span class="shop__photo-placeholder" style="display:none;">店舗写真</span>
    </div>

<dl class="shop__info">
<div class="shop__info-row"><dt>住所</dt><dd>北九州市小倉北区紺町3-3</dd></div>
</dl>
<a class="priceButton" href="#">料金の確認</a>
</section>
<section class="routeSection"><p class="routeSection__title">お店までのルート</p>
<a id="appleMapsButton" class="routeButton"
       href="https://maps.apple.com/?saddr=%E5%B0%8F%E5%80%89%E9%A7%85%20%E7%A6%8F%E5%B2%A1%E7%9C%8C%E5%8C%97%E4%B9%9D%E5%B7%9E%E5%B8%82&daddr=%E5%8C%97%E4%B9%9D%E5%B7%9E%E5%B8%82%E5%B0%8F%E5%80%89%E5%8C%97%E5%8C%BA%E7%B4%BA%E7%94%BA3-3&dirflg=w"
       target="_blank" rel="noopener noreferrer">iPhoneでルートを見る</a>
</section>
</main>
<script src="./script.js?v=11"></script>
</body>
</html>
